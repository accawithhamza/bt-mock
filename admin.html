<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – ACCA with Hamza</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d1a2b'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='bold' font-size='26' fill='%23c9a227' text-anchor='middle'%3EAH%3C/text%3E%3C/svg%3E">
<script>try { var p = JSON.parse(localStorage.getItem("ah_prefs") || "{}"); document.documentElement.dataset.theme = p.theme || "light"; } catch (e) {}</script>
<link rel="stylesheet" href="css/style.css?v=3">
<style>
.atabs{display:flex;gap:.2rem;flex-wrap:wrap}
.atab{background:none;border:0;color:#fff;padding:.5rem .8rem;border-radius:8px;cursor:pointer;font-weight:600;opacity:.85;display:inline-flex;gap:.35rem;align-items:center}
.atab:hover{background:rgba(255,255,255,.12);opacity:1}
.atab.on{background:rgba(255,255,255,.18);opacity:1;box-shadow:inset 0 -3px 0 var(--gold)}
.inbox{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 8.5rem);min-height:460px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.clist{border-right:1px solid var(--line);overflow-y:auto}
.citem{display:flex;gap:.6rem;padding:.7rem .8rem;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.citem:hover{background:var(--card2)}.citem.on{background:var(--card2);box-shadow:inset 4px 0 0 var(--gold)}
.citem .nm{font-weight:700;font-size:.9rem}.citem .pv{font-size:.78rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;min-width:0}
.thread .chat-h{border-radius:0}
.av{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pri);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:0 0 auto}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.toolbar .in{width:auto;min-width:200px;flex:1}
.toolbar select.in{flex:0 0 auto;min-width:140px}
.kv{display:grid;grid-template-columns:9rem 1fr;gap:.35rem .8rem;font-size:.88rem}
.kv span:nth-child(odd){color:var(--mut)}
@media (max-width:800px){.inbox{grid-template-columns:1fr;height:auto}.clist{max-height:260px;border-right:0;border-bottom:1px solid var(--line)}.thread{height:70vh}}
</style>
<script src="config.js?v=3"></script>
</head>
<body>
<div id="auth" class="hide"></div>
<div id="app" class="hide">
  <header class="top" style="flex-wrap:wrap">
    <div class="title"><img class="logo-img" id="aLogo" alt="" style="width:2.1rem;height:2.1rem"><span>Admin panel</span></div>
    <nav class="atabs" id="tabs"></nav>
    <button class="ibtn" id="refresh" title="Refresh data" aria-label="Refresh">⟳</button>
    <button class="ibtn" id="aout" title="Log out" aria-label="Log out" style="width:auto;padding:0 .6rem;font-weight:600">Log out</button>
  </header>
  <main id="view"></main>
</div>
<div id="ovl"></div>
<input type="file" id="aFile" accept="image/*" class="hide">
<script src="js/chat.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
</body>
</html>
